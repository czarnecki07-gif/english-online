<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rejestracja — Angielski online</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-klient.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #f7f5f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .karta { background: #fff; border: 1px solid #e8e4dc; border-radius: 10px; padding: 40px 44px; max-width: 480px; width: 100%; box-shadow: 0 8px 32px rgba(30,58,95,.1); position: relative; overflow: hidden; }
  .karta::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #1e3a5f, #b45309, #0f766e); }
  h1 { font-family: Georgia, serif; font-size: 1.5rem; color: #1e3a5f; margin-bottom: 6px; text-align: center; }
  .podtytul { color: #6b7280; font-size: .9rem; text-align: center; margin-bottom: 26px; }
  label { display: block; margin-bottom: 6px; font-weight: 600; font-size: .88rem; color: #4b5563; }
  input { width: 100%; padding: 12px 14px; border: 2px solid #c8c2b5; border-radius: 6px; font-family: inherit; font-size: .95rem; margin-bottom: 14px; }
  input:focus { outline: none; border-color: #1e3a5f; box-shadow: 0 0 0 3px rgba(30,58,95,.1); }
  button { width: 100%; padding: 14px; background: #1e3a5f; color: #fff; border: none; border-radius: 6px; font-family: inherit; font-weight: 700; font-size: .95rem; cursor: pointer; letter-spacing: 1.2px; text-transform: uppercase; }
  button:hover { background: #152a47; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .info { margin-top: 20px; padding-top: 18px; border-top: 1px solid #e8e4dc; font-size: .85rem; color: #9ca3af; text-align: center; }
  .info a { color: #1e3a5f; text-decoration: none; font-weight: 600; }
  .komunikat { margin-top: 14px; padding: 12px 14px; border-radius: 6px; font-size: .9rem; display: none; }
  .komunikat.ok { background: #f0fdf4; color: #166534; border-left: 4px solid #166534; display: block; }
  .komunikat.blad { background: #fef2f2; color: #991b1b; border-left: 4px solid #991b1b; display: block; }
</style>
</head>
<body>

<div class="karta">
  <h1>Rejestracja nauczyciela</h1>
  <p class="podtytul">Załóż konto, aby korzystać z kursu i prowadzić klasy</p>

  <form id="formRejestracji">
    <label for="imie">Imię i nazwisko</label>
    <input type="text" id="imie" required>

    <label for="szkola">Szkoła / instytucja (opcjonalnie)</label>
    <input type="text" id="szkola">

    <label for="email">E-mail</label>
    <input type="email" id="email" required>

    <label for="haslo">Hasło (min. 6 znaków)</label>
    <input type="password" id="haslo" required minlength="6">

    <label for="haslo2">Powtórz hasło</label>
    <input type="password" id="haslo2" required minlength="6">

    <button type="submit" id="btnRejestruj">Zarejestruj się</button>
  </form>

  <div id="komunikat" class="komunikat"></div>

  <div class="info">
    Masz już konto? <a href="login.html">Zaloguj się</a>
  </div>
</div>

<script>
document.getElementById("formRejestracji").addEventListener("submit", async function(e) {
  e.preventDefault();
  const btn = document.getElementById("btnRejestruj");
  const kom = document.getElementById("komunikat");
  const imie = document.getElementById("imie").value.trim();
  const szkola = document.getElementById("szkola").value.trim();
  const email = document.getElementById("email").value.trim();
  const haslo = document.getElementById("haslo").value;
  const haslo2 = document.getElementById("haslo2").value;

  kom.className = "komunikat";
  kom.textContent = "";

  if (haslo !== haslo2) { kom.className = "komunikat blad"; kom.textContent = "Hasa nie s takie same."; return; }
  if (haslo.length < 6) { kom.className = "komunikat blad"; kom.textContent = "Haso min. 6 znaków."; return; }
  if (!window.sbGotowy) { kom.className = "komunikat blad"; kom.textContent = "Trwa inicjalizacja. Spróbuj ponownie."; return; }

  btn.disabled = true;
  btn.textContent = "Rejestruj...";

  try {
    const { data, error } = await window.sb.auth.signUp({
      email: email, password: haslo,
      options: { data: { imie_nazwisko: imie, szkola: szkola } }
    });
    if (error) throw error;

    if (data.user) {
      await window.sb.from("profiles").update({
        imie_nazwisko: imie, szkola: szkola
      }).eq("id", data.user.id);
    }

    kom.className = "komunikat ok";
    kom.innerHTML = "Konto utworzone. <strong>Poczekaj na akceptacj administratora.</strong>";
    btn.textContent = "Zarejestrowano";
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "Zarejestruj si";
    let msg = err.message || "Bd rejestracji.";
    if (msg.indexOf("already") !== -1) msg = "Ten e-mail jest ju zarejestrowany.";
    kom.className = "komunikat blad";
    kom.textContent = msg;
  }
});
</script>

</body>
</html>
