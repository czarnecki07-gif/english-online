<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Panel administratora — diagnostyka</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-klient.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f7f5f0;margin:0;padding:20px;color:#1f2933}
main{max-width:900px;margin:0 auto}
.karta{background:#fff;border:1px solid #ddd;border-radius:6px;padding:20px;margin-bottom:16px}
h2{color:#1e3a5f;margin-top:0}
pre{background:#f0f4fb;border-left:4px solid #1e3a5f;padding:12px;border-radius:0 4px 4px 0;overflow-x:auto;font-size:.85rem}
.ok{color:#166534;font-weight:700}
.zle{color:#991b1b;font-weight:700}
</style>
</head>
<body>
<main>
  <div class="karta">
    <h2>Diagnostyka panelu admina</h2>
    <p>Ta strona pokazuje, co widzi Twoja przeglądarka. Skopiuj mi wynik.</p>
    <div id="wynik">Ładowanie...</div>
  </div>
</main>

<script>
async function diagnostyka(){
  var w = [];
  w.push("Adres strony: " + location.origin + location.pathname);
  w.push("localStorage — długość: " + localStorage.length);
  w.push("");
  w.push("Klucze w localStorage:");
  for (var i = 0; i < localStorage.length; i++) {
    var k = localStorage.key(i);
    w.push("  " + k);
  }
  w.push("");

  /* Czekaj na klienta Supabase */
  var n = 0;
  while(!window.sbGotowy && n < 50){
    await new Promise(function(r){ setTimeout(r, 100); });
    n++;
  }

  w.push("Czy sbGotowy: " + (window.sbGotowy ? "TAK" : "NIE"));
  w.push("Czy window.sb istnieje: " + (window.sb ? "TAK" : "NIE"));
  w.push("");

  if(!window.sb){
    w.push("BRAK klienta Supabase — plik supabase-klient.js się nie załadował.");
    wyswietl(w);
    return;
  }

  /* Sprawdź sesję */
  var s = await window.sb.auth.getSession();
  w.push("Sesja istnieje: " + (s.data && s.data.session ? "TAK" : "NIE"));
  if(s.data && s.data.session){
    w.push("User ID: " + s.data.session.user.id);
    w.push("E-mail: " + s.data.session.user.email);
    w.push("");
    var o = await window.sb.from("profiles").select("*").eq("id", s.data.session.user.id).single();
    w.push("Profil pobrany: " + (o.data ? "TAK" : "NIE"));
    if(o.error) w.push("Błąd profilu: " + o.error.message);
    if(o.data){
      w.push("  imie_nazwisko: " + (o.data.imie_nazwisko || "—"));
      w.push("  aktywny: " + o.data.aktywny);
      w.push("  admin: " + o.data.admin);
    }
  }

  wyswietl(w);
}

function wyswietl(linie){
  document.getElementById("wynik").innerHTML = "<pre>" + linie.map(function(l){
    return String(l).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]});
  }).join("\n") + "</pre>";
}

diagnostyka();
</script>
</body>
</html>
