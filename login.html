<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logowanie — Angielski online</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-klient.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #f7f5f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .karta { background: #fff; border: 1px solid #e8e4dc; border-radius: 10px; padding: 40px 44px; max-width: 440px; width: 100%; box-shadow: 0 8px 32px rgba(30,58,95,.1); position: relative; overflow: hidden; }
  .karta::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 5px; background: linear-gradient(90deg, #1e3a5f, #b45309, #0f766e); }
  h1 { font-family: Georgia, serif; font-size: 1.5rem; color: #1e3a5f; margin-bottom: 6px; text-align: center; }
  .podtytul { color: #6b7280; font-size: .9rem; text-align: center; margin-bottom: 26px; }
  label { display: block; margin-bottom: 6px; font-weight: 600; font-size: .88rem; color: #4b5563; }
  input { width: 100%; padding: 12px 14px; border: 2px solid #c8c2b5; border-radius: 6px; font-family: inherit; font-size: .95rem; margin-bottom: 14px; }
  input:focus { outline: none; border-color: #1e3a5f; box-shadow: 0 0 0 3px rgba(30,58,95,.1); }
  button { width: 100%; padding: 14px; background: #1e3a5f; color: #fff; border: none; border-radius: 6px; font-family: inherit; font-weight: 700; font-size: .95rem; cursor: pointer; letter-spacing: 1.2px; text-transform: uppercase; }
  button:hover { background: #152a47; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .info { margin-top: 20px; padding-top: 18px; border-top: 1px solid #e8e4dc; font-size: .85rem; color: #9ca3af; text-align: center; }
  .info a { color: #1e3a5f; text-decoration: none; font-weight: 600; }
  .komunikat { margin-top: 14px; padding: 12px 14px; border-radius: 6px; font-size: .9rem; display: none; }
  .komunikat.ok { background: #f0fdf4; color: #166534; border-left: 4px solid #166534; display: block; }
  .komunikat.blad { background: #fef2f2; color: #991b1b; border-left: 4px solid #991b1b; display: block; }
</style>
</head>
<body>

<div class="karta">
  <h1>Logowanie</h1>
  <p class="podtytul">Zaloguj się jako nauczyciel</p>

  <form id="formLogowania">
    <label for="email">E-mail</label>
    <input type="email" id="email" required autocomplete="email">

    <label for="haslo">Hasło</label>
    <input type="password" id="haslo" required autocomplete="current-password">

    <button type="submit" id="btnLogin">Zaloguj się</button>
  </form>

  <div id="komunikat" class="komunikat"></div>

  <div class="info">
    Nie masz konta? <a href="rejestracja.html">Zarejestruj się</a>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", async function() {
  if (!window.sbGotowy) { setTimeout(function() { location.reload(); }, 500); return; }
  const { data: { session } } = await window.sb.auth.getSession();
  if (session) {
    const { data: profil } = await window.sb.from("profiles").select("aktywny").eq("id", session.user.id).single();
    if (profil && profil.aktywny) window.location.href = "index.html";
  }
});

document.getElementById("formLogowania").addEventListener("submit", async function(e) {
  e.preventDefault();
  const btn = document.getElementById("btnLogin");
  const kom = document.getElementById("komunikat");
  const email = document.getElementById("email").value.trim();
  const haslo = document.getElementById("haslo").value;

  kom.className = "komunikat";
  kom.textContent = "";

  if (!window.sbGotowy) { kom.className = "komunikat blad"; kom.textContent = "Trwa inicjalizacja."; return; }

  btn.disabled = true;
  btn.textContent = "Loguj...";

  try {
    const { data, error } = await window.sb.auth.signInWithPassword({ email: email, password: haslo });
    if (error) throw error;

    const { data: profil, error: bladProfilu } = await window.sb.from("profiles").select("aktywny").eq("id", data.user.id).single();
    if (bladProfilu) throw bladProfilu;

    if (!profil || !profil.aktywny) {
      await window.sb.auth.signOut();
      kom.className = "komunikat blad";
      kom.innerHTML = "<strong>Konto nieaktywne.</strong> Administrator musi zatwierdzi rejestracj.";
      btn.disabled = false;
      btn.textContent = "Zaloguj si";
      return;
    }

    kom.className = "komunikat ok";
    kom.textContent = "Zalogowano. Przekierowanie...";
    setTimeout(function() { window.location.href = "index.html"; }, 600);
  } catch (err) {
    btn.disabled = false;
    btn.textContent = "Zaloguj si";
    let msg = err.message || "Bd logowania.";
    if (msg.indexOf("Invalid login") !== -1) msg = "Bdny e-mail lub haso.";
    if (msg.indexOf("Email not confirmed") !== -1) msg = "E-mail niepotwierdzony.";
    kom.className = "komunikat blad";
    kom.textContent = msg;
  }
});
</script>

</body>
</html>
