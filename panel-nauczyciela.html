<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Panel nauczyciela</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-klient.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f7f5f0;margin:0;padding:20px;color:#1f2933}
header{background:#1e3a5f;color:#fff;padding:16px;margin:-20px -20px 0;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none;margin-left:10px}
nav{background:#fff;border-bottom:1px solid #ddd;padding:0 20px;margin:0 -20px 20px;display:flex;gap:4px}
nav button{background:none;border:none;padding:14px 18px;font-weight:600;color:#6b7280;border-bottom:3px solid transparent;cursor:pointer;font-family:inherit;font-size:.92rem}
nav button.active{color:#1e3a5f;border-bottom-color:#b45309}
main{max-width:1100px;margin:0 auto}
section{display:none;background:#fff;border:1px solid #ddd;border-radius:6px;padding:20px;margin-bottom:16px}
section.active{display:block}
h2{color:#1e3a5f;margin-top:0}
label{display:block;font-weight:600;font-size:.88rem;margin-bottom:4px;color:#4b5563}
input,select{width:100%;padding:9px;border:1px solid #ccc;border-radius:4px;font-size:.95rem;box-sizing:border-box;font-family:inherit}
.rzad{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.rzad>div{flex:1;min-width:150px}
button{cursor:pointer;font-family:inherit}
.glowne{background:#1e3a5f;color:#fff;border:none;padding:12px 28px;border-radius:4px;font-weight:700;text-transform:uppercase;letter-spacing:1px}
.glowne:hover{background:#152a47}
.drugie{background:#fff;color:#1e3a5f;border:1px solid #1e3a5f;padding:8px 18px;border-radius:4px;font-weight:600}
.drugie:hover{background:#1e3a5f;color:#fff}
.czerwony{color:#991b1b;border-color:#991b1b}
.czerwony:hover{background:#991b1b;color:#fff}
.lista-lekcji{max-height:300px;overflow-y:auto;border:1px solid #ddd;border-radius:4px;padding:12px;margin-bottom:14px;background:#fbfaf7}
.grupa-t{font-weight:700;color:#1e3a5f;margin:8px 0 4px}
.lista-lekcji label{display:flex;align-items:center;gap:8px;padding:4px;font-weight:400;cursor:pointer;font-size:.87rem}
.lista-lekcji input[type=checkbox]{width:auto}
.filtry{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:5px 12px;border:1px solid #ccc;background:#fff;border-radius:20px;font-size:.8rem;cursor:pointer}
.chip.active{background:#1e3a5f;color:#fff;border-color:#1e3a5f}
.info-box{background:#fffbeb;border-left:4px solid #b45309;padding:12px;margin-bottom:14px;color:#78350f;font-size:.88rem}
.link-box{background:#f0fdf4;border:2px solid #166534;border-radius:6px;padding:18px;margin-top:18px}
.link-box h3{color:#166534;margin-top:0}
.link-siatka{display:grid;grid-template-columns:260px 1fr;gap:20px}
.qr-holder{background:#fff;padding:10px;border:1px solid #d1fae5;display:inline-block}
.link-url{font-family:monospace;font-size:.78rem;background:#fff;padding:10px;border:1px solid #d1fae5;word-break:break-all;margin-bottom:10px}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:.9rem}
th,td{padding:9px;text-align:left;border-bottom:1px solid #eee}
th{background:#fbfaf7;color:#1e3a5f;font-size:.8rem;text-transform:uppercase}
.pusta{text-align:center;color:#999;padding:20px;font-style:italic}
.dobry{color:#166534;font-weight:700}
.sredni{color:#b45309;font-weight:700}
.zly{color:#991b1b;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}
.modal.on{display:flex}
.modal-tresc{background:#fff;border-radius:10px;padding:30px;text-align:center;max-width:500px}
</style>
</head>
<body>

<header>
  <h1 style="margin:0;font-size:1.15rem">Panel nauczyciela</h1>
  <div><a href="index.html">← Powrót</a><a href="#" id="wyloguj">Wyloguj</a></div>
</header>

<nav>
  <button data-tab="nowy" class="active">Nowy test</button>
  <button data-tab="testy">Moje testy</button>
  <button data-tab="wyniki">Wyniki uczniów</button>
</nav>

<main>

<section id="tab-nowy" class="active">
  <h2>Nowy test online</h2>
  <div class="info-box">
    Wygeneruj test — dostaniesz <strong>QR kod i link</strong>. W klasie wyświetl QR na projektorze, zdalnie skopiuj link. Wyniki zobaczysz w zakładce „Wyniki uczniów".
  </div>

  <div class="rzad">
    <div><label>Klasa</label><input type="text" id="klasa" placeholder="np. 3A"></div>
    <div><label>Czas (min, 0 = bez limitu)</label><input type="number" id="czas" value="30"></div>
    <div><label>Liczba pytań</label><input type="number" id="liczba" value="20"></div>
  </div>

  <label>Wybierz lekcje:</label>
  <div class="filtry">
    <button class="chip active" data-fp="all">Wszystkie</button>
    <button class="chip" data-fp="A0">A0</button>
    <button class="chip" data-fp="A1">A1</button>
    <button class="chip" data-fp="A2">A2</button>
    <button class="chip" data-fp="B1">B1</button>
    <button class="chip" data-fp="B2">B2</button>
    <button class="chip" data-fp="C1">C1</button>
    <button class="chip" id="zaznaczWszystkie" style="margin-left:auto">Zaznacz wszystkie</button>
  </div>

  <div class="lista-lekcji" id="listaLekcji">Ładowanie...</div>
  <div class="info-box" id="infoWyboru">Zaznaczono 0 lekcji.</div>

  <button class="glowne" id="generujBtn">Generuj test</button>

  <div id="wynikGenerowania" style="display:none"></div>
</section>

<section id="tab-testy">
  <h2>Moje testy</h2>
  <div id="listaTestow" class="pusta">Ładowanie...</div>
</section>

<section id="tab-wyniki">
  <h2>Wyniki uczniów</h2>
  <div class="rzad">
    <div style="flex:2"><label>Wybierz test</label><select id="wyborTestu"><option value="">— wybierz —</option></select></div>
    <div><button class="drugie" id="odswiezWynikiBtn">Odśwież</button></div>
  </div>
  <div id="tabelaWynikow"></div>
</section>

</main>

<div class="modal" id="modalQR"><div class="modal-tresc">
  <h3>QR kod testu</h3>
  <div class="qr-holder" id="modalQRHolder"></div>
  <div class="link-url" id="modalQRLink"></div>
  <button class="glowne" id="modalKopiuj">Kopiuj link</button>
  <button class="drugie" id="modalZamknij">Zamknij</button>
</div></div>

<script>
var profil=null,lekcje={},filtrPoziom="all",WSZYSTKIE_LEKCJE={};

document.querySelectorAll("nav button").forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll("nav button").forEach(function(x){x.classList.remove("active")});
    document.querySelectorAll("section").forEach(function(s){s.classList.remove("active")});
    b.classList.add("active");
    document.getElementById("tab-"+b.dataset.tab).classList.add("active");
    if(b.dataset.tab==="testy")odswiezTesty();
    if(b.dataset.tab==="wyniki")odswiezWyborTestow();
  };
});

async function czekajNaSb(){
  if(window.sbGotowy)return;
  await new Promise(function(r){var n=0;var i=setInterval(function(){n++;if(window.sbGotowy||n>30){clearInterval(i);r()}},100)});
}

async function start(){
  await czekajNaSb();
  if(!window.sb){alert("Błąd inicjalizacji.");return}
  var s=await window.sb.auth.getSession();
  if(!s.data.session){location.href="login.html";return}
  var o=await window.sb.from("profiles").select("*").eq("id",s.data.session.user.id).single();
  profil=o.data;
  if(!profil||!profil.aktywny){location.href="index.html";return}
  await zaladujLekcje();
  renderujListeLekcji();
  odswiezWyborTestow();
}

async function zaladujLekcje(){
  var pliki=["A0","G-A1","G-A2","G-B1","G-B2","G-C1","T-A1","T-A2","T-B1","T-B2","T-C1"];
  for(var i=0;i<pliki.length;i++){
    await new Promise(function(r){var s=document.createElement("script");s.src="dane/"+pliki[i]+".js";s.onload=s.onerror=r;document.head.appendChild(s)});
  }
  lekcje=window.LESSON_DATA||{};
  Object.keys(lekcje).forEach(function(id){
    var l=lekcje[id];
    if(l&&l.test&&l.test.length)WSZYSTKIE_LEKCJE[id]={tytul:l.tytul,poziom:l.poziom,liczba:l.test.length};
  });
}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

function renderujListeLekcji(){
  var kont=document.getElementById("listaLekcji");
  var ids=Object.keys(WSZYSTKIE_LEKCJE).filter(function(id){return filtrPoziom==="all"||WSZYSTKIE_LEKCJE[id].poziom===filtrPoziom}).sort();
  if(!ids.length){kont.innerHTML="<em>Brak lekcji.</em>";return}
  var grupy={};
  ids.forEach(function(id){var m=id.match(/^([GT]\d+|A0)/);var g=m?m[1]:"?";(grupy[g]=grupy[g]||[]).push(id)});
  var html="";
  Object.keys(grupy).sort().forEach(function(g){
    html+='<div class="grupa-t">'+g+'</div>';
    grupy[g].forEach(function(id){
      var l=WSZYSTKIE_LEKCJE[id];
      html+='<label><input type="checkbox" data-id="'+id+'"> '+id+" — "+esc(l.tytul)+' ('+l.liczba+' pytań)</label>';
    });
  });
  kont.innerHTML=html;
  kont.querySelectorAll("input[type=checkbox]").forEach(function(c){c.onchange=aktualizujInfo});
  aktualizujInfo();
}

function pobierzZaznaczone(){
  var out=[];
  document.querySelectorAll("#listaLekcji input[type=checkbox]:checked").forEach(function(c){out.push(c.dataset.id)});
  return out;
}

function aktualizujInfo(){
  var z=pobierzZaznaczone();
  var ile=0;
  z.forEach(function(id){ile+=WSZYSTKIE_LEKCJE[id].liczba});
  document.getElementById("infoWyboru").textContent="Zaznaczono "+z.length+" lekcji, dostępnych "+ile+" pytań.";
}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function pokazQR(url,kontenerId){
  var h=document.getElementById(kontenerId);
  if(!h)return;
  h.innerHTML="";
  try{new QRCode(h,{text:url,width:240,height:240,correctLevel:QRCode.CorrectLevel.M})}catch(e){console.error(e)}
}

async function generujTest(){
  var klasa=document.getElementById("klasa").value.trim();
  var czas=parseInt(document.getElementById("czas").value)||0;
  var liczba=parseInt(document.getElementById("liczba").value)||20;
  var zazn=pobierzZaznaczone();
  if(!klasa){alert("Wpisz klasę.");return}
  if(!zazn.length){alert("Zaznacz lekcję.");return}
  var pula=[];
  zazn.forEach(function(id){lekcje[id].test.forEach(function(q){pula.push(q)})});
  if(pula.length<liczba){alert("Za mało pytań (dostępne: "+pula.length+").");return}
  var wybrane=shuffle(pula).slice(0,liczba);
  var btn=document.getElementById("generujBtn");
  btn.disabled=true;btn.textContent="Generuję...";
  var o=await window.sb.from("testy").insert({nauczyciel_id:profil.id,klasa:klasa,nazwa:klasa,liczba_pytan:wybrane.length,czas_min:czas,pytania:wybrane,wersje:1}).select().single();
  btn.disabled=false;btn.textContent="Generuj test";
  if(o.error){alert("Błąd: "+o.error.message);return}
  var link=location.origin+"/uczen.html?t="+o.data.id;
  var kont=document.getElementById("wynikGenerowania");
  kont.style.display="block";
  kont.innerHTML='<div class="link-box"><h3>Test gotowy</h3><p style="color:#166534"><strong>W klasie:</strong> wyświetl QR na projektorze — uczniowie skanują.<br><strong>Zdalnie:</strong> kopiuj link i wyślij.</p><div class="link-siatka"><div><div class="qr-holder" id="qrNowy"></div></div><div><label>Link:</label><div class="link-url" id="linkTestu">'+esc(link)+'</div><button class="glowne" onclick="kopiujLink()">Kopiuj link</button></div></div></div>';
  kont.scrollIntoView({behavior:"smooth"});
  setTimeout(function(){pokazQR(link,"qrNowy")},50);
}

function kopiujLink(){
  var t=document.getElementById("linkTestu").textContent;
  navigator.clipboard.writeText(t).then(function(){alert("Skopiowano!")}).catch(function(){alert("Skopiuj ręcznie")});
}

async function odswiezTesty(){
  var o=await window.sb.from("testy").select("*").eq("nauczyciel_id",profil.id).order("data_utworzenia",{ascending:false});
  var kont=document.getElementById("listaTestow");
  if(o.error){kont.innerHTML='<div class="pusta">Błąd: '+o.error.message+'</div>';return}
  if(!o.data.length){kont.innerHTML='<div class="pusta">Brak testów. Wygeneruj pierwszy w zakładce „Nowy test".</div>';return}
  var html='<table><thead><tr><th>Klasa</th><th>Pytania</th><th>Czas</th><th>Data</th><th>Akcje</th></tr></thead><tbody>';
  o.data.forEach(function(t){
    var link=location.origin+"/uczen.html?t="+t.id;
    html+='<tr><td><strong>'+esc(t.klasa||"—")+'</strong></td><td>'+t.liczba_pytan+'</td><td>'+(t.czas_min?t.czas_min+" min":"—")+'</td><td>'+new Date(t.data_utworzenia).toLocaleString("pl")+'</td>';
    html+='<td><button class="drugie" data-qr="'+t.id+'" data-link="'+esc(link)+'">Pokaż QR</button> <button class="drugie" data-copy="'+esc(link)+'">Kopiuj link</button> <button class="drugie czerwony" data-del="'+t.id+'">Usuń</button></td></tr>';
  });
  html+='</tbody></table>';
  kont.innerHTML=html;
  kont.querySelectorAll("[data-copy]").forEach(function(b){b.onclick=function(){navigator.clipboard.writeText(b.dataset.copy).then(function(){alert("Skopiowano!")})}});
  kont.querySelectorAll("[data-qr]").forEach(function(b){b.onclick=function(){document.getElementById("modalQRLink").textContent=b.dataset.link;document.getElementById("modalQR").classList.add("on");setTimeout(function(){pokazQR(b.dataset.link,"modalQRHolder")},50)}});
  kont.querySelectorAll("[data-del]").forEach(function(b){b.onclick=async function(){if(!confirm("Usunąć?"))return;await window.sb.from("testy").delete().eq("id",b.dataset.del);odswiezTesty()}});
}

document.getElementById("modalZamknij").onclick=function(){document.getElementById("modalQR").classList.remove("on")};
document.getElementById("modalKopiuj").onclick=function(){navigator.clipboard.writeText(document.getElementById("modalQRLink").textContent).then(function(){alert("Skopiowano!")})};

async function odswiezWyborTestow(){
  var o=await window.sb.from("testy").select("id,klasa,liczba_pytan,data_utworzenia").eq("nauczyciel_id",profil.id).order("data_utworzenia",{ascending:false});
  var sel=document.getElementById("wyborTestu");
  sel.innerHTML='<option value="">— wybierz —</option>';
  if(!o.data)return;
  o.data.forEach(function(t){
    var opt=document.createElement("option");
    opt.value=t.id;
    opt.textContent=(t.klasa||"?")+" · "+t.liczba_pytan+" pytań · "+new Date(t.data_utworzenia).toLocaleDateString("pl");
    sel.appendChild(opt);
  });
}

async function odswiezWyniki(){
  var id=document.getElementById("wyborTestu").value;
  var kont=document.getElementById("tabelaWynikow");
  if(!id){kont.innerHTML="";return}
  var o=await window.sb.from("wyniki").select("*").eq("test_id",id).order("data_oddania",{ascending:false});
  if(o.error){kont.innerHTML='<div class="pusta">Błąd: '+o.error.message+'</div>';return}
  if(!o.data.length){kont.innerHTML='<div class="pusta">Brak wyników.</div>';return}
  var html='<table><thead><tr><th>#</th><th>Uczeń</th><th>Punkty</th><th>%</th><th>Ocena</th><th>Data</th></tr></thead><tbody>';
  o.data.forEach(function(w,i){
    var pct=w.procent||0;
    var k=pct>=80?"dobry":(pct>=50?"sredni":"zly");
    var oc=pct>=90?"5":pct>=75?"4":pct>=50?"3":pct>=30?"2":"1";
    html+='<tr><td>'+(i+1)+'</td><td><strong>'+esc(w.uczen_imie||"?")+'</strong></td><td>'+w.punkty+" / "+w.max_punktow+'</td><td class="'+k+'">'+pct+'%</td><td class="'+k+'">'+oc+'</td><td>'+new Date(w.data_oddania).toLocaleString("pl")+'</td></tr>';
  });
  html+='</tbody></table>';
  kont.innerHTML=html;
}

document.getElementById("wyborTestu").onchange=odswiezWyniki;
document.getElementById("odswiezWynikiBtn").onclick=odswiezWyniki;
document.querySelectorAll(".chip[data-fp]").forEach(function(b){b.onclick=function(){filtrPoziom=b.dataset.fp;document.querySelectorAll(".chip[data-fp]").forEach(function(x){x.classList.remove("active")});b.classList.add("active");renderujListeLekcji()}});
document.getElementById("zaznaczWszystkie").onclick=function(){document.querySelectorAll("#listaLekcji input[type=checkbox]").forEach(function(c){c.checked=true});aktualizujInfo()};
document.getElementById("generujBtn").onclick=generujTest;
document.getElementById("wyloguj").onclick=async function(e){e.preventDefault();if(!confirm("Wylogować?"))return;await window.sb.auth.signOut();location.href="login.html"};

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);else start();
</script>
</body>
</html>
