<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprawdzian</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-klient.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f7f5f0;color:#1f2933;line-height:1.6}
.ekran{min-height:100vh;padding:40px 20px;display:flex;align-items:center;justify-content:center}
.karta{background:#fff;border:1px solid #e8e4dc;border-radius:8px;padding:32px 36px;max-width:580px;width:100%;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.karta h1{font-family:Georgia,serif;font-size:1.4rem;color:#1e3a5f;margin-bottom:8px}
.karta .meta{color:#6b7280;font-size:.9rem;margin-bottom:22px;line-height:1.7}
.karta label{display:block;margin-bottom:8px;font-weight:600;font-size:.9rem}
.karta input[type=text]{width:100%;padding:12px 14px;border:2px solid #c8c2b5;border-radius:6px;font-size:1rem;font-family:inherit}
.karta input[type=text]:focus{outline:none;border-color:#1e3a5f}
.karta button{margin-top:18px;width:100%;padding:14px 24px;background:#1e3a5f;color:#fff;border:none;border-radius:6px;font-weight:700;font-size:1rem;cursor:pointer;letter-spacing:1px;text-transform:uppercase;font-family:inherit}
.karta button:hover{background:#152a47}
body.w-test{background:#bfdbfe}
.test-header{position:sticky;top:0;z-index:10;background:#1e3a5f;color:#fff;padding:14px 26px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.test-header .info{font-size:.9rem}
.test-header .info strong{font-size:1.05rem}
.test-header .zegar{font-family:monospace;font-size:1.5rem;font-weight:700;background:rgba(255,255,255,.15);padding:6px 16px;border-radius:6px}
.test-header .zegar.ostrzezony{background:#dc2626}
.test-main{max-width:780px;margin:22px auto;padding:0 20px 40px}
.postep{background:rgba(255,255,255,.7);border-radius:6px;padding:10px 16px;margin-bottom:18px;text-align:center;font-weight:600;color:#1e3a5f}
.pytanie{background:#fff;border:1px solid #dbeafe;border-radius:8px;padding:20px 24px;margin-bottom:14px}
.pytanie .nr{color:#1e3a5f;font-weight:700;margin-right:10px}
.pytanie .tresc{font-weight:600;margin-bottom:14px}
.pytanie .opcje{display:flex;flex-direction:column;gap:6px}
.pytanie .opcje label{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:6px;cursor:pointer;border:2px solid transparent}
.pytanie .opcje label:hover{background:#eff6ff}
.pytanie .opcje input{accent-color:#1e3a5f;width:18px;height:18px}
.pytanie .opcje label.wybrane{background:#dbeafe;border-color:#3b82f6}
.przycisk-zakoncz{display:block;margin:26px auto 0;padding:16px 44px;background:#1e3a5f;color:#fff;border:none;border-radius:6px;font-weight:700;font-size:1rem;cursor:pointer;text-transform:uppercase;letter-spacing:1.5px;font-family:inherit}
.przycisk-zakoncz:hover{background:#152a47}
.auto-info{text-align:center;margin-top:20px;padding:14px;background:#fffbeb;border:2px solid #fcd34d;border-radius:6px;color:#78350f;font-weight:600}
.bledy{color:#991b1b;padding:20px;text-align:center;font-size:.95rem;line-height:1.6}
</style>
</head>
<body>

<div class="ekran" id="ekranStart">
  <div class="karta">
    <h1>Sprawdzian</h1>
    <div class="meta" id="metaTestu">Ładowanie...</div>
    <label for="imieUcznia">Twoje imię i nazwisko:</label>
    <input type="text" id="imieUcznia" placeholder="np. Jan Kowalski" autocomplete="off">
    <button id="startBtn">Rozpocznij sprawdzian</button>
  </div>
</div>

<div id="ekranTest" style="display:none">
  <div class="test-header">
    <div class="info">
      <strong id="naglowekTestu"></strong><br>
      <span id="infoUcznia"></span>
    </div>
    <div class="zegar" id="zegar">--:--</div>
  </div>
  <div class="test-main">
    <div class="postep" id="postep"></div>
    <div id="listaPytan"></div>
    <button class="przycisk-zakoncz" id="zakonczBtn">Zakończ sprawdzian</button>
    <div id="autoInfo" class="auto-info" style="display:none">
      Wszystkie odpowiedzi zaznaczone. Automatyczne zakończenie za <span id="autoLicznik">3</span>...
    </div>
  </div>
</div>

<div class="ekran" id="ekranKoniec" style="display:none">
  <div class="karta">
    <h1>Sprawdzian zakończony</h1>
    <p style="text-align:center;color:#6b7280;margin-top:16px;">Twój wynik został zapisany. Możesz zamknąć tę stronę.</p>
    <p style="text-align:center;margin-top:20px;"><strong id="wynikPokaz" style="font-family:Georgia,serif;font-size:2rem;color:#1e3a5f;"></strong></p>
    <p style="text-align:center;color:#6b7280;font-size:.9rem;margin-top:10px;">Nauczyciel widzi Twój wynik w swoim panelu.</p>
  </div>
</div>

<div class="ekran" id="ekranBledu" style="display:none">
  <div class="karta">
    <h1>Nie można otworzyć sprawdzianu</h1>
    <p class="bledy" id="trescBledu"></p>
  </div>
</div>

<script>
var TEST=null, PYTANIA=[], ODPOWIEDZI=[], IMIE="";
var START_CZASU=0, KONIEC_CZASU=0, ZEGAR=null, AUTO=null, ZAKONCZONE=false;

document.addEventListener("DOMContentLoaded", async function() {
  var t = new URLSearchParams(location.search).get("t");
  if(!t){ pokazBlad("Brak kodu sprawdzianu w adresie URL."); return; }

  await czekajNaSb();
  if(!window.sb){ pokazBlad("Błąd inicjalizacji."); return; }

  var o = await window.sb.from("testy").select("*").eq("id", t).single();
  if(o.error || !o.data){ pokazBlad("Nie znaleziono sprawdzianu. " + (o.error ? o.error.message : "")); return; }
  TEST = o.data;
  PYTANIA = TEST.pytania || [];
  if(!PYTANIA.length){ pokazBlad("Sprawdzian nie zawiera pytań."); return; }

  ODPOWIEDZI = PYTANIA.map(function(){ return -1; });

  document.getElementById("metaTestu").innerHTML =
    "Klasa: <strong>" + (TEST.klasa || "—") + "</strong><br>" +
    "Liczba pytań: <strong>" + PYTANIA.length + "</strong><br>" +
    "Czas: <strong>" + (TEST.czas_min ? TEST.czas_min + " min" : "bez limitu") + "</strong>";

  document.getElementById("startBtn").addEventListener("click", rozpocznij);
  document.getElementById("imieUcznia").addEventListener("keydown", function(e){ if(e.key==="Enter") rozpocznij(); });
  document.getElementById("zakonczBtn").addEventListener("click", function(){ if(confirm("Zakończyć sprawdzian?")) zakoncz(); });
});

async function czekajNaSb(){
  if(window.sbGotowy) return;
  await new Promise(function(r){ var n=0; var i=setInterval(function(){ n++; if(window.sbGotowy||n>30){ clearInterval(i); r(); } },100); });
}

function pokazBlad(m){
  document.getElementById("ekranStart").style.display="none";
  document.getElementById("ekranBledu").style.display="flex";
  document.getElementById("trescBledu").textContent=m;
}

function rozpocznij(){
  var imie = document.getElementById("imieUcznia").value.trim();
  if(!imie){ alert("Wpisz imię i nazwisko."); return; }
  IMIE = imie;
  START_CZASU = Date.now();
  KONIEC_CZASU = TEST.czas_min ? START_CZASU + TEST.czas_min*60*1000 : 0;

  document.getElementById("ekranStart").style.display="none";
  document.body.classList.add("w-test");
  document.getElementById("ekranTest").style.display="block";
  document.getElementById("naglowekTestu").textContent = "Sprawdzian – " + (TEST.klasa || "");
  document.getElementById("infoUcznia").textContent = IMIE;

  renderPytania();
  aktualizujPostep();
  if(TEST.czas_min) startZegar();
  else document.getElementById("zegar").textContent = "∞";
}

function renderPytania(){
  var html = "";
  PYTANIA.forEach(function(p,i){
    html += '<div class="pytanie" data-i="'+i+'">';
    html += '<div class="tresc"><span class="nr">'+(i+1)+'.</span> '+p.q+'</div>';
    html += '<div class="opcje">';
    (p.opcje||[]).forEach(function(op,j){
      var lit = String.fromCharCode(65+j);
      html += '<label><input type="radio" name="p'+i+'" value="'+j+'"> <strong>'+lit+')</strong> '+op+'</label>';
    });
    html += '</div></div>';
  });
  document.getElementById("listaPytan").innerHTML = html;
  document.querySelectorAll('.pytanie input[type=radio]').forEach(function(r){
    r.onchange = function(){
      var i = parseInt(r.name.substring(1));
      ODPOWIEDZI[i] = parseInt(r.value);
      var pyt = r.closest(".pytanie");
      pyt.querySelectorAll("label").forEach(function(l){ l.classList.remove("wybrane"); });
      r.closest("label").classList.add("wybrane");
      aktualizujPostep();
      sprawdzCzyGotowe();
    };
  });
}

function aktualizujPostep(){
  var odp = ODPOWIEDZI.filter(function(o){ return o!==-1; }).length;
  document.getElementById("postep").textContent = "Odpowiedziano: "+odp+" / "+PYTANIA.length;
}

function sprawdzCzyGotowe(){
  if(ZAKONCZONE) return;
  if(ODPOWIEDZI.filter(function(o){ return o===-1; }).length !== 0) return;
  var info = document.getElementById("autoInfo");
  info.style.display="block";
  var n = 3;
  document.getElementById("autoLicznik").textContent = n;
  AUTO = setInterval(function(){
    n--;
    document.getElementById("autoLicznik").textContent = n;
    if(n<=0){ clearInterval(AUTO); AUTO=null; zakoncz(); }
  }, 1000);
}

function startZegar(){
  odswiezZegar();
  ZEGAR = setInterval(odswiezZegar, 1000);
}

function odswiezZegar(){
  if(ZAKONCZONE) return;
  var pozostalo = Math.max(0, KONIEC_CZASU - Date.now());
  var sek = Math.floor(pozostalo/1000);
  var m = Math.floor(sek/60);
  var s = sek%60;
  var el = document.getElementById("zegar");
  el.textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  if(pozostalo <= 60000) el.classList.add("ostrzezony");
  if(pozostalo <= 0){ clearInterval(ZEGAR); zakoncz(); }
}

async function zakoncz(){
  if(ZAKONCZONE) return;
  ZAKONCZONE = true;
  if(ZEGAR) clearInterval(ZEGAR);
  if(AUTO) clearInterval(AUTO);

  var punkty = 0;
  ODPOWIEDZI.forEach(function(o,i){ if(o === PYTANIA[i].poprawna) punkty++; });
  var max = PYTANIA.length;
  var procent = Math.round(punkty/max*100);
  var sekundy = Math.round((Date.now() - START_CZASU)/1000);

  var o = await window.sb.from("wyniki").insert({
    test_id: TEST.id,
    uczen_imie: IMIE,
    punkty: punkty,
    max_punktow: max,
    procent: procent,
    wersja: "A",
    odpowiedzi: ODPOWIEDZI,
    czas_sekundy: sekundy
  });

  document.body.classList.remove("w-test");
  document.getElementById("ekranTest").style.display="none";
  document.getElementById("ekranKoniec").style.display="flex";
  document.getElementById("wynikPokaz").textContent = punkty + " / " + max + " (" + procent + "%)";

  if(o.error){
    document.getElementById("wynikPokaz").textContent = "Wynik zapisany lokalnie, błąd wysyłki: " + o.error.message;
  }
}
</script>
</body>
</html>
