<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprawdzian</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; }
  .ekran { min-height: 100vh; padding: 40px 20px; display: flex; align-items: center; justify-content: center; }
  .karta { background: #fff; border: 1px solid #e8e4dc; border-radius: 8px; padding: 32px 36px; max-width: 580px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,.06); }
  .karta h1 { font-family: Georgia, serif; font-size: 1.4rem; color: #1e3a5f; margin-bottom: 8px; }
  .karta .meta { color: #6b7280; font-size: .9rem; margin-bottom: 22px; line-height: 1.7; }
  .karta label { display: block; margin-bottom: 8px; font-weight: 600; font-size: .9rem; }
  .karta input[type=text] { width: 100%; padding: 12px 14px; border: 2px solid #c8c2b5; border-radius: 6px; font-family: inherit; font-size: 1rem; }
  .karta input[type=text]:focus { outline: none; border-color: #1e3a5f; }
  .karta button { margin-top: 18px; width: 100%; padding: 14px 24px; background: #1e3a5f; color: #fff; border: none; border-radius: 6px; font-family: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; }
  .karta button:hover { background: #152a47; }

  /* NIEBIESKIE TŁO TESTU */
  body.w-test { background: #bfdbfe; }
  .test-header { position: sticky; top: 0; z-index: 10; background: #1e3a5f; color: #fff; padding: 14px 26px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .test-header .info { font-size: .9rem; }
  .test-header .info strong { font-size: 1.05rem; }
  .test-header .zegar { font-family: 'SF Mono', Consolas, monospace; font-size: 1.5rem; font-weight: 700; letter-spacing: 1px; background: rgba(255,255,255,.15); padding: 6px 16px; border-radius: 6px; }
  .test-header .zegar.ostrzezony { background: #dc2626; animation: puls 1s infinite; }
  @keyframes puls { 50% { opacity: .6; } }

  .test-main { max-width: 780px; margin: 22px auto; padding: 0 20px 40px; }
  .postep { background: rgba(255,255,255,.7); border-radius: 6px; padding: 10px 16px; margin-bottom: 18px; font-size: .9rem; color: #1e3a5f; text-align: center; font-weight: 600; }
  .pytanie { background: #fff; border: 1px solid #dbeafe; border-radius: 8px; padding: 20px 24px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(30,58,95,.06); }
  .pytanie.odpowiedziane { border-color: #93c5fd; }
  .pytanie .nr { color: #1e3a5f; font-weight: 700; margin-right: 10px; }
  .pytanie .tresc { font-weight: 600; margin-bottom: 14px; font-size: 1rem; }
  .pytanie .opcje { display: flex; flex-direction: column; gap: 6px; }
  .pytanie .opcje label { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 6px; cursor: pointer; border: 2px solid transparent; transition: .1s; }
  .pytanie .opcje label:hover { background: #eff6ff; }
  .pytanie .opcje input { accent-color: #1e3a5f; width: 18px; height: 18px; }
  .pytanie .opcje label.wybrane { background: #dbeafe; border-color: #3b82f6; }
  .pytanie .opcje .lit { font-weight: 700; color: #6b7280; }
  .przycisk-zakoncz { display: block; margin: 26px auto 0; padding: 16px 44px; background: #1e3a5f; color: #fff; border: none; border-radius: 6px; font-family: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; letter-spacing: 1.5px; text-transform: uppercase; }
  .przycisk-zakoncz:hover { background: #152a47; }
  .auto-info { text-align: center; margin-top: 20px; padding: 14px; background: #fffbeb; border: 2px solid #fcd34d; border-radius: 6px; color: #78350f; font-weight: 600; }
  .auto-info .licznik { font-family: monospace; font-size: 1.6rem; }
  .kod-pole { width: 100%; margin-top: 12px; padding: 14px; border: 2px solid #c8c2b5; border-radius: 6px; font-family: 'SF Mono', Consolas, monospace; font-size: .8rem; background: #fbfaf7; min-height: 100px; resize: vertical; word-break: break-all; }
  .kopiuj { margin-top: 12px; padding: 12px 24px; background: #b45309; color: #fff; border: none; border-radius: 6px; font-family: inherit; font-weight: 700; cursor: pointer; font-size: .9rem; }
  .kopiuj:hover { background: #92400e; }
  .sukces { color: #166534; font-weight: 600; margin-top: 8px; }
  .bledy { color: #991b1b; padding: 20px; text-align: center; font-size: .95rem; line-height: 1.6; }
</style>
</head>
<body>

<div class="ekran" id="ekranStart">
  <div class="karta">
    <h1>Sprawdzian</h1>
    <div class="meta" id="metaTestu"></div>
    <label for="imieUcznia">Twoje imię i nazwisko:</label>
    <input type="text" id="imieUcznia" placeholder="np. Jan Kowalski" autocomplete="off">
    <button id="startBtn">Rozpocznij sprawdzian</button>
  </div>
</div>

<div id="ekranTest" style="display:none">
  <div class="test-header">
    <div class="info">
      <strong id="naglowekTestu"></strong><br>
      <span id="infoUcznia"></span>
    </div>
    <div class="zegar" id="zegar">--:--</div>
  </div>
  <div class="test-main">
    <div class="postep" id="postep"></div>
    <div id="listaPytan"></div>
    <button class="przycisk-zakoncz" id="zakonczBtn">Zakończ sprawdzian</button>
    <div id="autoInfo" class="auto-info" style="display:none">
      Wszystkie odpowiedzi zaznaczone. Automatyczne zakończenie za <span class="licznik" id="autoLicznik">3</span>… (kliknij „Zakończ sprawdzian" aby anulować)
    </div>
  </div>
</div>

<div class="ekran" id="ekranKoniec" style="display:none">
  <div class="karta">
    <h1>Sprawdzian zakończony</h1>
    <div class="meta" id="podsumowanie"></div>
    <label>Kod dla nauczyciela — skopiuj i prześlij lub pokaż:</label>
    <textarea class="kod-pole" id="kodWynik" readonly></textarea>
    <button class="kopiuj" id="kopiujBtn">Skopiuj kod</button>
    <div id="sukcesKopii" class="sukces" style="display:none">✓ Skopiowano do schowka</div>
  </div>
</div>

<div class="ekran" id="ekranBledu" style="display:none">
  <div class="karta">
    <h1>Nie można otworzyć sprawdzianu</h1>
    <p class="bledy" id="trescBledu"></p>
  </div>
</div>

<script>
function b64Decode(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  try {
    var bin = atob(s);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  } catch (e) { return null; }
}
function b64Encode(str) {
  var bytes = new TextEncoder().encode(str);
  var bin = "";
  bytes.forEach(function(b) { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

var TEST = null;
var ODPOWIEDZI = [];
var IMIE = "";
var START_CZASU = 0;
var KONIEC_CZASU = 0;
var ZEGAR_INT = null;
var AUTO_INT = null;
var ZAKONCZONE = false;

document.addEventListener("DOMContentLoaded", function() {
  var params = new URLSearchParams(location.search);
  var kod = params.get("k");
  if (!kod) { pokazBlad("Brak kodu sprawdzianu w adresie URL. Poproś nauczyciela o właściwy link."); return; }
  var json = b64Decode(kod);
  if (!json) { pokazBlad("Kod sprawdzianu jest uszkodzony lub nieczytelny."); return; }
  try { TEST = JSON.parse(json); }
  catch (e) { pokazBlad("Nie udało się odczytać danych sprawdzianu."); return; }
  if (!TEST.pytania || !TEST.pytania.length) { pokazBlad("Sprawdzian nie zawiera pytań."); return; }

  ODPOWIEDZI = TEST.pytania.map(function() { return -1; });
  document.getElementById("metaTestu").innerHTML =
    "Klasa: <strong>" + (TEST.klasa || "—") + "</strong><br>" +
    "Nauczyciel: <strong>" + (TEST.nauczyciel || "—") + "</strong><br>" +
    "Liczba pytań: <strong>" + TEST.pytania.length + "</strong><br>" +
    "Czas: <strong>" + (TEST.czas ? TEST.czas + " min" : "bez limitu") + "</strong>";

  document.getElementById("startBtn").addEventListener("click", rozpocznij);
  document.getElementById("imieUcznia").addEventListener("keydown", function(e) { if (e.key === "Enter") rozpocznij(); });
  document.getElementById("zakonczBtn").addEventListener("click", function() { if (confirm("Czy na pewno zakończyć sprawdzian?")) zakonczRęcznie(); });
  document.getElementById("kopiujBtn").addEventListener("click", kopiujKod);
});

function pokazBlad(msg) {
  document.getElementById("ekranStart").classList.add("hidden");
  document.getElementById("ekranStart").style.display = "none";
  document.getElementById("ekranBledu").style.display = "flex";
  document.getElementById("trescBledu").textContent = msg;
}

function rozpocznij() {
  var imie = document.getElementById("imieUcznia").value.trim();
  if (!imie) { alert("Wpisz swoje imię i nazwisko."); return; }
  IMIE = imie;
  START_CZASU = Date.now();
  KONIEC_CZASU = TEST.czas ? START_CZASU + TEST.czas * 60 * 1000 : 0;

  document.getElementById("ekranStart").style.display = "none";
  document.body.classList.add("w-test");
  document.getElementById("ekranTest").style.display = "block";
  document.getElementById("naglowekTestu").textContent = "Sprawdzian – " + (TEST.klasa || "");
  document.getElementById("infoUcznia").textContent = IMIE;
  document.getElementById("listaPytan").innerHTML = renderPytania();
  podepnijOdpowiedzi();
  aktualizujPostep();
  startZegara();
}

function renderPytania() {
  var html = "";
  TEST.pytania.forEach(function(p, i) {
    html += '<div class="pytanie" data-i="' + i + '">';
    html += '<div class="tresc"><span class="nr">' + (i + 1) + '.</span>' + p.q + '</div>';
    html += '<div class="opcje">';
    p.o.forEach(function(op, j) {
      var lit = String.fromCharCode(65 + j);
      html += '<label><input type="radio" name="p' + i + '" value="' + j + '"> ';
      html += '<span class="lit">' + lit + ')</span> <span>' + op + '</span></label>';
    });
    html += '</div></div>';
  });
  return html;
}

function podepnijOdpowiedzi() {
  document.querySelectorAll('.pytanie input[type=radio]').forEach(function(radio) {
    radio.addEventListener("change", function() {
      var i = parseInt(radio.name.substring(1));
      ODPOWIEDZI[i] = parseInt(radio.value);
      var pyt = radio.closest(".pytanie");
      pyt.querySelectorAll("label").forEach(function(l) { l.classList.remove("wybrane"); });
      radio.closest("label").classList.add("wybrane");
      pyt.classList.add("odpowiedziane");
      aktualizujPostep();
      sprawdzCzyWszystko();
    });
  });
}

function aktualizujPostep() {
  var odp = ODPOWIEDZI.filter(function(o) { return o !== -1; }).length;
  document.getElementById("postep").textContent = "Odpowiedziano: " + odp + " / " + TEST.pytania.length;
}

function sprawdzCzyWszystko() {
  if (ZAKONCZONE) return;
  var brakuje = ODPOWIEDZI.filter(function(o) { return o === -1; }).length;
  if (brakuje !== 0) return;
  var info = document.getElementById("autoInfo");
  var licznik = document.getElementById("autoLicznik");
  info.style.display = "block";
  var n = 3;
  licznik.textContent = n;
  AUTO_INT = setInterval(function() {
    n--;
    licznik.textContent = n;
    if (n <= 0) { clearInterval(AUTO_INT); AUTO_INT = null; zakonczRęcznie(); }
  }, 1000);
}

function startZegara() {
  if (!TEST.czas) { document.getElementById("zegar").textContent = "∞"; return; }
  odswiezZegar();
  ZEGAR_INT = setInterval(odswiezZegar, 1000);
}

function odswiezZegar() {
  if (ZAKONCZONE) return;
  var pozostalo = Math.max(0, KONIEC_CZASU - Date.now());
  var sek = Math.floor(pozostalo / 1000);
  var min = Math.floor(sek / 60);
  var s = sek % 60;
  var el = document.getElementById("zegar");
  el.textContent = String(min).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  if (pozostalo <= 60000) el.classList.add("ostrzezony");
  if (pozostalo <= 0) { clearInterval(ZEGAR_INT); zakonczAuto(); }
}

function zakonczRęcznie() { if (ZAKONCZONE) return; ZAKONCZONE = true; zakonczWspolne(); }
function zakonczAuto() { if (ZAKONCZONE) return; ZAKONCZONE = true; alert("Czas minął. Sprawdzian zostaje zakończony."); zakonczWspolne(); }

function zakonczWspolne() {
  if (ZEGAR_INT) { clearInterval(ZEGAR_INT); ZEGAR_INT = null; }
  if (AUTO_INT) { clearInterval(AUTO_INT); AUTO_INT = null; }

  var punkty = 0;
  ODPOWIEDZI.forEach(function(odp, i) { if (odp === TEST.pytania[i].p) punkty++; });
  var max = TEST.pytania.length;

  var receipt = {
    v: 1,
    tid: TEST.id || "?",
    klasa: TEST.klasa || "",
    u: IMIE,
    d: new Date().toISOString(),
    a: ODPOWIEDZI,
    pkt: punkty,
    max: max
  };
  var kod = b64Encode(JSON.stringify(receipt));

  document.getElementById("podsumowanie").innerHTML =
    "<strong>Uczeń:</strong> " + IMIE + "<br>" +
    "<strong>Klasa:</strong> " + (TEST.klasa || "—") + "<br>" +
    "<strong>Odpowiedzi:</strong> " + ODPOWIEDZI.filter(function(o){return o!==-1;}).length + " / " + max + "<br>" +
    "<strong>Czas:</strong> " + Math.floor((Date.now() - START_CZASU) / 1000) + " s";

  document.getElementById("kodWynik").value = kod;
  document.body.classList.remove("w-test");
  document.getElementById("ekranTest").style.display = "none";
  document.getElementById("ekranKoniec").style.display = "flex";
}

function kopiujKod() {
  var t = document.getElementById("kodWynik");
  t.select();
  t.setSelectionRange(0, 99999);
  try {
    document.execCommand("copy");
    document.getElementById("sukcesKopii").style.display = "block";
    setTimeout(function() { document.getElementById("sukcesKopii").style.display = "none"; }, 2500);
  } catch (e) { alert("Nie udało się skopiować — zaznacz kod i skopiuj ręcznie."); }
}
</script>
</body>
</html>
